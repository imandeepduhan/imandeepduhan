<svg xmlns="http://www.w3.org/2000/svg"
width="700"
height="430"
viewBox="0 0 700 430">

<rect
    width="100%"
    height="100%"
    rx="12"
    fill="#0d1117"
    stroke="#30363d"
    stroke-width="1"/>


<!-- Title -->

<text
    x="35"
    y="48"
    fill="#f0f6fc"
    font-size="20"
    font-family="Arial, sans-serif">
    Activity overview
</text>


<!-- Center vertical line -->

<line
    x1="470"
    y1="90"
    x2="470"
    y2="340"
    stroke="#39d353"
    stroke-width="3"/>


<!-- Center horizontal line -->

<line
    x1="345"
    y1="215"
    x2="595"
    y2="215"
    stroke="#39d353"
    stroke-width="3"/>


<!-- Activity polygon -->

<polygon
    points="470.0,211.2 470.0,215.0 470.0,238.8 372.5,215.0"
    fill="#39d353"
    fill-opacity="0.30"
    stroke="#39d353"
    stroke-width="3"/>


<!-- Center -->

<circle
    cx="470"
    cy="215"
    r="5"
    fill="#39d353"/>


<!-- Code review -->

<text
    x="470"
    y="80"
    text-anchor="middle"
    fill="#8b949e"
    font-size="17"
    font-family="Arial, sans-serif">
    3%
</text>

<text
    x="470"
    y="102"
    text-anchor="middle"
    fill="#8b949e"
    font-size="15"
    font-family="Arial, sans-serif">
    Code review
</text>


<!-- Issues -->

<text
    x="625"
    y="207"
    fill="#8b949e"
    font-size="17"
    font-family="Arial, sans-serif">
    0%
</text>

<text
    x="625"
    y="232"
    fill="#8b949e"
    font-size="15"
    font-family="Arial, sans-serif">
    Issues
</text>


<!-- Pull requests -->

<text
    x="470"
    y="380"
    text-anchor="middle"
    fill="#8b949e"
    font-size="17"
    font-family="Arial, sans-serif">
    19%
</text>

<text
    x="470"
    y="403"
    text-anchor="middle"
    fill="#8b949e"
    font-size="15"
    font-family="Arial, sans-serif">
    Pull requests
</text>


<!-- Commits -->

<text
    x="315"
    y="207"
    text-anchor="end"
    fill="#8b949e"
    font-size="17"
    font-family="Arial, sans-serif">
    78%
</text>

<text
    x="315"
    y="232"
    text-anchor="end"
    fill="#8b949e"
    font-size="15"
    font-family="Arial, sans-serif">
    Commits
</text>

</svg>
